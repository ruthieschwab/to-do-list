<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do List</title>
<meta name="description" content="Personal to-do list with tags, notes, and drag-to-reorder. Works offline.">
<meta name="theme-color" content="#3B6E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To Do">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #EEF0EA;
  --surface: #FFFFFF;
  --surface-sunken: #E4E7DF;
  --ink: #22261F;
  --ink-muted: #63695C;
  --ink-faint: #9BA192;
  --accent: #3B6E63;
  --accent-ink: #F5F8F5;
  --line: #DADED2;
  --done: #9AA396;
  --danger: #A8523C;
  --urgent-bg: #F6DEDA;
  --urgent-border: #D99A8D;
  --shadow: 0 1px 2px rgba(34,38,31,0.06), 0 4px 14px rgba(34,38,31,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14180F;
    --surface: #1C2117;
    --surface-sunken: #262C1F;
    --ink: #E9ECE1;
    --ink-muted: #A2A896;
    --ink-faint: #6B7162;
    --accent: #74C0AA;
    --accent-ink: #0D1610;
    --line: #2C3325;
    --done: #5B6250;
    --danger: #D98A72;
    --urgent-bg: #3A2320;
    --urgent-border: #8C5148;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #14180F;
  --surface: #1C2117;
  --surface-sunken: #262C1F;
  --ink: #E9ECE1;
  --ink-muted: #A2A896;
  --ink-faint: #6B7162;
  --accent: #74C0AA;
  --accent-ink: #0D1610;
  --line: #2C3325;
  --done: #5B6250;
  --danger: #D98A72;
  --urgent-bg: #3A2320;
  --urgent-border: #8C5148;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
}
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
#app { max-width: 560px; margin: 0 auto; padding: 0 0 140px; }
.dk-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding: 10px 18px 8px;
  border-bottom: 1px solid var(--line);
}
.dk-titlerow {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.dk-title {
  font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1.25rem;
  margin: 0;
  letter-spacing: -0.01em;
}
.dk-meta {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.72rem;
  color: var(--ink-muted);
  flex: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  font-variant-numeric: tabular-nums;
}
.dk-sync {
  display: inline-flex; align-items: center; gap: 5px;
}
.dk-sync .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.dk-sync.offline .dot { background: var(--danger); }

.dk-filterbar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 8px;
}
.dk-filter {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.74rem;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-muted);
}
.dk-filter.active { border-color: var(--ink); color: var(--accent-ink); background: var(--ink); font-weight: 500; }
.dk-filter[data-filter="urgent"].active { border-color: var(--urgent-border); color: var(--danger); background: var(--urgent-bg); }

.dk-add {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 25;
  display: flex; gap: 8px;
  max-width: 560px;
  margin: 0 auto;
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 14px rgba(34,38,31,0.06);
}
.dk-add input {
  flex: 1;
  font: inherit;
  font-size: 1rem;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.dk-add input::placeholder { color: var(--ink-faint); }
.dk-add input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.dk-add button {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  font-weight: 500;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  border-radius: 10px;
  padding: 0 18px;
  cursor: pointer;
}
.dk-add button:focus-visible, .dk-row button:focus-visible, .dk-add input:focus-visible, .dk-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.dk-list { list-style: none; margin: 8px 0 0; padding: 0 10px; }
.dk-row {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 10px;
  margin: 0 0 8px;
  box-shadow: var(--shadow);
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
}
.dk-row input, .dk-row textarea, .dk-row [contenteditable="true"] {
  -webkit-touch-callout: default;
  -webkit-user-select: text; user-select: text;
}
.dk-row.dragging { z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.18); cursor: grabbing; touch-action: none; }
.dk-row.urgent { background: var(--urgent-bg); border-color: var(--urgent-border); }
.dk-check {
  appearance: none; -webkit-appearance: none;
  width: 21px; height: 21px; min-width: 21px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-faint);
  margin-top: 2px;
  cursor: pointer;
  display: grid; place-content: center;
}
.dk-check:checked { background: var(--accent); border-color: var(--accent); }
.dk-check:checked::after {
  content: "✓"; color: var(--accent-ink); font-size: 0.75rem; font-weight: 700;
}
.dk-body { flex: 1; min-width: 0; }
.dk-text {
  font-size: 1rem;
  line-height: 1.4;
  cursor: text;
  word-break: break-word;
}
.dk-text a { color: var(--accent); text-decoration: underline; }
.dk-row.done .dk-text { color: var(--done); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.dk-extras { display: none; }
.dk-row.editing .dk-extras { display: block; }
.dk-noteflag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--ink-faint);
  margin-top: 4px;
  cursor: pointer;
  background: none; border: none; padding: 0;
}
.dk-noteflag.has {
  display: inline-block;
  color: var(--ink);
  background: var(--surface-sunken);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
  font-weight: 500;
}
.dk-notes {
  width: 100%;
  margin-top: 8px;
  font: inherit;
  font-size: 0.88rem;
  color: var(--ink-muted);
  background: var(--surface-sunken);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  resize: vertical;
  min-height: 44px;
}
.dk-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.dk-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  padding: 2px 9px;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-faint);
}
.dk-tag.on { border-color: var(--ink); color: var(--accent-ink); background: var(--ink); font-weight: 500; }
.dk-urgent {
  background: none; border: 1px solid var(--line); color: var(--ink-faint);
  font-size: 0.68rem; font-family: 'IBM Plex Mono', monospace;
  cursor: pointer; padding: 2px 9px; border-radius: 999px; line-height: 1.4;
}
.dk-urgent.on { border-color: var(--urgent-border); color: var(--danger); background: var(--urgent-bg); font-weight: 500; }
.dk-del {
  background: none; border: none; color: var(--ink-faint);
  font-size: 1rem; cursor: pointer; padding: 4px 2px; line-height: 1;
}
.dk-del:hover { color: var(--danger); }

.dk-donesection { margin: 22px 10px 0; }
.dk-donehead {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0 4px 8px;
}
.dk-empty {
  padding: 40px 18px; text-align: center; color: var(--ink-faint);
  font-family: 'Newsreader', serif; font-style: italic; font-size: 1.1rem;
}
.dk-footer {
  margin: 28px 10px 0; text-align: center;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-faint);
}
.dk-link {
  font: inherit; color: inherit; background: none; border: none; padding: 6px 4px;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.dk-link:hover { color: var(--ink); }
.dk-sep { padding: 0 4px; }
.dk-panel {
  margin: 12px 10px 0; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  font-size: 0.86rem; line-height: 1.45; color: var(--ink-muted);
}
.dk-panel p { margin: 0 0 10px; }
.dk-panel b { color: var(--ink); font-weight: 600; }
.dk-panelrow { display: flex; gap: 8px; }
.dk-panel input {
  flex: 1; min-width: 0; font: inherit; padding: 8px 10px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-sunken); color: var(--ink);
}
.dk-panel input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.dk-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; font-weight: 500;
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink);
}
.dk-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dk-panelmsg { margin: 10px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; }
.dk-panelmsg:empty { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .dk-row { transition: transform 0.18s ease, box-shadow 0.18s ease; }
  .dk-row.dragging { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="./sync.js"></script>
<script src="./app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
